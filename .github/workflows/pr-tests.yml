# Dış PR'lar için yalnız test: native derleme, model indirme, paketleme ve imza yok.
name: pr-tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Yalnız ilgili klasör değişince ilgili işler çalışsın. Elle çalıştırmada hepsi çalışır.
  changes:
    name: Değişen yollar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      tv: ${{ steps.filter.outputs.tv }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA}" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "tv=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          printf '%s\n' "$files"
          match() { if grep -Eq "$1" <<< "$files"; then echo true; else echo false; fi; }
          wf='^\.github/workflows/pr-tests\.yml$'
          res='^shared/'
          echo "windows=$(match "^windows/|^testdata/|^design/|^scripts/tv-live-page\.js$|${res}|${wf}")" >> "$GITHUB_OUTPUT"
          echo "tv=$(match "^tv-android/|^tv-webos/|^scripts/tv-|${wf}")" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows / .NET
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      COUCHSUBS_DOWNLOAD_TEST_MODELS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Paketler depoda değil (özel R2). Sır yoksa (dış katkıcı PR'ı) atlanır, gerçek paket testleri kendini atlar.
      - name: Oyun paketleri (özel R2)
        shell: bash
        env:
          PACKS_R2_ACCESS_KEY_ID: ${{ secrets.PACKS_R2_ACCESS_KEY_ID }}
          PACKS_R2_SECRET_ACCESS_KEY: ${{ secrets.PACKS_R2_SECRET_ACCESS_KEY }}
          PACKS_R2_ENDPOINT: ${{ secrets.PACKS_R2_ENDPOINT }}
        run: python scripts/fetch-packs.py
      # Çözümün tamamı App/native/paketleme bağımlılıklarını getirir; yalnız test projelerini derle.
      # Zamanlama testleri CPU paylaşımından etkilenmesin diye projeler sırayla çalışır.
      - name: .NET testleri
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = $false
          $projects = @(Get-ChildItem windows/tests/*/*.csproj)
          if ($projects.Count -eq 0) { throw 'Test projesi bulunamadı.' }
          foreach ($project in $projects) {
            dotnet test $project.FullName --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=$($project.BaseName).trx" --results-directory "$env:RUNNER_TEMP/test-results"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pr-windows-test-results
          path: ${{ runner.temp }}/test-results/*.trx
          if-no-files-found: error
          retention-days: 7

  tv:
    name: Android TV / JVM
    needs: changes
    if: ${{ needs.changes.outputs.tv == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
          cache-read-only: true
      - name: TV keşif ve eşleştirme testleri
        run: node --test scripts/tv-discovery.test.js
      - name: JVM testleri
        working-directory: tv-android
        run: gradle testSideloadReleaseUnitTest testPlayReleaseUnitTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pr-tv-android-test-results
          path: tv-android/app/build/test-results/
          if-no-files-found: error
          retention-days: 7
